<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizi Disponibili - Gym</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Impedisce lo scroll orizzontale quando il menu è aperto */
        }

        /* Style per l'header fisso */
        header {
            background: linear-gradient(to right, #1e3a8a, #2563eb);
            color: white;
            padding: 20px;
            text-align: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000; /* Per evitare che l'header venga coperto */
        }

        /* Menu laterale */
        .side-menu {
            width: 250px;
            background-color: #1e3a8a;
            color: white;
            position: fixed;
            height: 100%;
            top: 0;
            left: -250px; /* Inizialmente nascosto */
            transition: left 0.3s ease;
            z-index: 999; /* Assicurati che il menu sia sopra il contenuto */
        }

        .side-menu a {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            margin: 10px 0;
            transition: background-color 0.3s;
        }

        .side-menu a:hover {
            background-color: #2563eb;
        }

        /* Bottone hamburger */
        .hamburger {
            font-size: 30px;
            cursor: pointer;
            color: white;
            position: fixed;
            left: 20px;
            top: 20px;
            z-index: 1001; /* Assicurarsi che l'icona sia sopra il menu */
        }

        /* Overlay quando il menu è aperto */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }

        .overlay.show {
            display: block;
        }

        /* Contenuto */
        .content {
            margin-left: 0; /* Inizialmente il contenuto occupa tutta la larghezza */
            padding: 20px;
            margin-top: 120px; /* Per evitare sovrapposizione con l'header */
            transition: margin-left 0.3s ease;
        }

        table {
            width: 80%; /* La larghezza della tabella è ora l'80% della larghezza della pagina */
            max-width: 1000px; /* Imposta una larghezza massima */
            margin: 20px auto; 
            border-collapse: collapse;
        }

        table th, table td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        table tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        table th {
            background-color: #1e3a8a;
            color: white;
        }

        footer {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 15px 0;
            width: 100%;
            position: relative;
            bottom: 0;
        }

        /* Responsività per il menu */
        @media screen and (max-width: 768px) {
            .side-menu {
                width: 100%;
            }

            .content {
                margin-left: 0;
            }
        }

    </style>
</head>
<body>
    <div class="hamburger" onclick="toggleMenu()">☰</div>

    <!-- Menu laterale -->
    <div class="side-menu" id="sideMenu">
        <a href="homepage.html">Homepage</a>
        <a href="scheda.html">La mia Scheda</a>
        <a href="esercizi.html">Esercizi Disponibili</a>
        <a href="profilo.html">Il mio Profilo</a>
        <a href="login.html" id="logout">Logout</a>
    </div>

    <!-- Overlay per oscurare il contenuto quando il menu è aperto -->
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="content">
        <header>
            <h1>Esercizi Disponibili</h1>
        </header>

        <main>
            <table>
                <thead>
                    <tr>
                        <th>Esercizio</th>
                        <th>Descrizione</th>
                        <th>Serie</th>
                        <th>Giorno</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody id="savedExercises"></tbody>
            </table>

            <footer>
                <p>© 2025 Gym App | <a href="#">Privacy Policy</a> | <a href="#">Contattaci</a></p>
            </footer>
        </main>
    </div>

    <script>
        // Funzione per aprire e chiudere il menu laterale
        function toggleMenu() {
            const sideMenu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            const content = document.querySelector('.content');

            // Se il menu è chiuso, aprilo
            if (sideMenu.style.left === '-250px' || sideMenu.style.left === '') {
                sideMenu.style.left = '0'; // Mostra il menu
                content.style.marginLeft = '250px'; // Sposta il contenuto a destra
                overlay.classList.add('show'); // Mostra l'overlay
            } else {
                sideMenu.style.left = '-250px'; // Nascondi il menu
                content.style.marginLeft = '0'; // Ripristina il contenuto
                overlay.classList.remove('show'); // Nascondi l'overlay
            }
        }

        // Funzione per caricare gli esercizi salvati
        fetch('/getSavedExercises')
        .then(response => response.json()) 
        .then(exercises => {
            const tableBody = document.getElementById("savedExercises");
            exercises.forEach(exercise => {
                const row = document.createElement("tr");
                row.id = `exercise-${exercise.id}`;
                const nomeCell = document.createElement("td");
                nomeCell.textContent = exercise.nome; 

                const descrizioneCell = document.createElement("td");
                descrizioneCell.textContent = exercise.descrizione;

                const serieCell = document.createElement("td");
                const serieSelect = document.createElement("select");
                serieSelect.className = "serie-select";
                for(let i = 1; i <= 10; i++) {
                    const option = document.createElement("option");
                    option.value = i;
                    option.textContent = i + " serie";
                    serieSelect.appendChild(option);
                }
                serieCell.appendChild(serieSelect);

                const giornoCell = document.createElement("td");
                const giornoSelect = document.createElement("select");
                giornoSelect.className = "giorno-select";
                const giorni = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];
                giorni.forEach(giorno => {
                    const option = document.createElement("option");
                    option.value = giorno;
                    option.textContent = giorno;
                    giornoSelect.appendChild(option);
                });
                giornoCell.appendChild(giornoSelect);

                const actionCell = document.createElement("td");
                const addButton = document.createElement("button");
                addButton.textContent = "Aggiungi";
                addButton.className = "add-button";
                addButton.onclick = () => {
                    const serie = serieSelect.value;
                    const giorno = giornoSelect.value;
                    
                    fetch('/addExerciseToWorkout', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            exercise: exercise.nome,
                            day: giorno,
                            sets: serie,
                            username: localStorage.getItem('username')
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if(data.success) {
                            alert('Esercizio aggiunto alla scheda!');
                        } else {
                            alert('Errore durante il salvataggio: ' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Errore:', error);
                        alert('Errore durante il salvataggio');
                    });
                };
                actionCell.appendChild(addButton);

                row.appendChild(nomeCell);
                row.appendChild(descrizioneCell);
                row.appendChild(serieCell);
                row.appendChild(giornoCell);
                row.appendChild(actionCell);
                tableBody.appendChild(row);
            });
        })
        .catch(error => console.error("Errore nel caricamento: ", error));
    </script>
</body>
</html>
