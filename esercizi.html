<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizi Disponibili - Gym</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        table tr {
            background-color: #f4f4f4;  /* Colore di sfondo per le righe della tabella */
        }
        /* Menù laterale */
       .side-menu {
            width: 250px;
            background-color: #1e3a8a;
            color: white;
            position: fixed;
            height: 100%;
            padding-top: 20px;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.2);
            left: 0;
            top: 0;
        }

        .side-menu a {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            margin: 10px 0;
            transition: background-color 0.3s;
        }

        .side-menu a:hover {
            background-color: #2563eb;
        }
        header {
            background: linear-gradient(to right, #1e3a8a, #2563eb);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            margin-left: 230px;
            width: 100%;
            padding: 20px;
        }

        .exercise-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .exercise-card h3 {
            color: #333;
        }

        .exercise-card p {
            color: #666;
            margin-bottom: 10px;
        }

        .input-group {
            margin-top: 10px;
        }

        select, input {
            padding: 10px;
            margin-right: 10px;
        }

        .add-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-button:hover {
            background-color: #45a049;
        }

        footer {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 15px 0;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

    </style>
</head>
<body>
    <div class="side-menu">
        <a href="homepage.html">Homepage</a>
        <a href="scheda.html">La mia Scheda</a>
        <a href="esercizi.html">Esercizi Disponibili</a>
        <a href="profilo.html">Il mio Profilo</a>
        <a href="login.html" id="logout">Logout</a>
    </div>

    <div class="content">
        <header>
            <h1>Esercizi Disponibili</h1>
        </header>

        <main>
            
            <table>
                <thead>
                    <tr>
                        <th>Esercizio</th>
                        <th>Giorno</th>
                        <th>Serie</th>
                    </tr>
                </thead>
                <tbody id="savedExercises"></tbody>
            </table>

            <footer>
                <p>© 2025 Gym App | <a href="#">Privacy Policy</a> | <a href="#">Contattaci</a></p>
            </footer>
        </main>
        
        <script>
            // Funzione per caricare gli esercizi salvati dalla tabella piano_workout
        function loadSavedExercises() {
                  
            // Uso fetch per fare una richiesta GET alla route del server
            fetch('/getSavedExercises')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Errore nel recupero dei dati');
                    }
                    return response.json();
                })
                .then(exercises => {
                    console.log(exercises);  // Log per vedere cosa ricevi dal server
                    const tableBody = document.getElementById("savedExercises");

                    // Pulisce la tabella prima di aggiungere i nuovi dati
                    tableBody.innerHTML = "";
                    if (exercises.length === 0) {
                        console.log('Nessun esercizio trovato nella tabella');  // Log per nessun dato trovato
                    } else {
                        console.log('Esercizi trovati:', exercises); // Log per vedere i dati ricevuti
                    }
        
                    // Aggiungo ogni esercizio come una nuova riga della tabella
                    exercises.result.forEach(exercise => {
                        console.log(exercise);
                        const row = tableBody.insertRow(); // Crea una nuova riga

                        // Creo le celle e inserisci i dati
                        const cell1 = row.insertCell(0);
                        const cell2 = row.insertCell(1);
                        const cell3 = row.insertCell(2);

                        cell1.textContent = exercise.esercizio;  // Nome dell'esercizio
                        cell2.textContent = exercise.giorno;     // Giorno
                        cell3.textContent = exercise.sets;       // Numero di serie
                    });
                })
                .catch(error => {
                    console.error("Errore durante il recupero degli esercizi:", error);
                });
        }

        // Carico gli esercizi salvati quando la pagina è pronta
        document.addEventListener('DOMContentLoaded', loadSavedExercises);
    
    </script>
</body>
</html>
