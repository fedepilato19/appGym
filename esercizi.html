<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizi Disponibili - Gym</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            height: 100%;  /* Assicura che l'intera altezza della finestra venga utilizzata */
            margin: 0;  /* Rimuove i margini predefiniti */
        }
        table tr {
            background-color: #f4f4f4;  /* Colore di sfondo per le righe della tabella */
        }
        /* Menù laterale */
       .side-menu {
            width: 250px;
            background-color: #1e3a8a;
            color: white;
            position: fixed;
            height: 100%;
            padding-top: 20px;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.2);
            left: 0;
            top: 0;
        }

        .side-menu a {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            margin: 10px 0;
            transition: background-color 0.3s;
        }

        .side-menu a:hover {
            background-color: #2563eb;
        }
        header {
            background: linear-gradient(to right, #1e3a8a, #2563eb);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            margin-left: 230px;
            width: 100%;
            padding: 20px;
        }

        .exercise-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .exercise-card h3 {
            color: #333;
        }

        .exercise-card p {
            color: #666;
            margin-bottom: 10px;
        }

        .input-group {
            margin-top: 10px;
        }

        select, input {
            padding: 10px;
            margin-right: 10px;
        }

        .add-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-button:hover {
            background-color: #45a049;
        }

        footer {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 15px 0;
            position: absolute;
            bottom: 0;
            width: 100%;
            transition: background-color 0.3s;
        }

        .exercise-form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .exercise-form h3 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
        }

        .exercise-form .input-group {
            margin-bottom: 15px;
        }

        .exercise-form label {
            display: block;
            margin-bottom: 5px;
        }

        .exercise-form select, .exercise-form input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .exercise-form button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .exercise-form button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="side-menu">
        <a href="homepage.html">Homepage</a>
        <a href="scheda.html">La mia Scheda</a>
        <a href="esercizi.html">Esercizi Disponibili</a>
        <a href="profilo.html">Il mio Profilo</a>
        <a href="login.html" id="logout">Logout</a>
    </div>

    <div class="content">
        <header>
            <h1>Esercizi Disponibili</h1>
        </header>

        <main>
            <div class="exercise-form">
                <h3>Aggiungi un nuovo esercizio</h3>
                <form id="addExerciseForm">
                    <div class="input-group">
                        <label for="exercise">Esercizio:</label>
                        <select id="exercise" required>
                            <option value="Push-up">Push-up</option>
                            <option value="Squat">Squat</option>
                            <option value="Plank">Plank</option>
                            <option value="Lunges">Lunges</option>
                            <!-- Aggiungi qui altri esercizi -->
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="day">Giorno:</label>
                        <select id="day" required>
                            <option value="Lunedì">Lunedì</option>
                            <option value="Martedì">Martedì</option>
                            <option value="Mercoledì">Mercoledì</option>
                            <option value="Giovedì">Giovedì</option>
                            <option value="Venerdì">Venerdì</option>
                            <option value="Sabato">Sabato</option>
                            <option value="Domenica">Domenica</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="sets">Serie:</label>
                        <input type="number" id="sets" min="1" required>
                    </div>

                    <button type="submit" class="add-button">Aggiungi all'allenamento</button>
                </form>
            </div>

            <table>
                <tbody id="savedExercises"></tbody>
            </table>

            <footer>
                <p>© 2025 Gym App | <a href="#">Privacy Policy</a> | <a href="#">Contattaci</a></p>
            </footer>
        </main>

        <script>
            // Funzione per caricare gli esercizi salvati dalla tabella piano_workout
            function loadSavedExercises() {
                fetch('/getSavedExercises')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById("savedExercises");
                    container.innerHTML = "";
                    
                    data.result.forEach(exercise => {
                        const card = document.createElement("div");
                        card.classList.add("exercise-card");
                        
                        card.innerHTML = `
                            <h3>${exercise.esercizio}</h3>
                            <p><strong>Giorno:</strong> ${exercise.giorno}</p>
                            <p><strong>Serie:</strong> ${exercise.sets}</p>
                        `;
                        
                        container.appendChild(card);
                    });
                })
                .catch(error => console.error("Errore nel recupero degli esercizi:", error));
            }

            document.addEventListener('DOMContentLoaded', loadSavedExercises);

            // Gestione del form per aggiungere esercizi
            document.getElementById('addExerciseForm').addEventListener('submit', function(event) {
                event.preventDefault();

                const exercise = document.getElementById('exercise').value;
                const day = document.getElementById('day').value;
                const sets = document.getElementById('sets').value;

                const newExercise = { exercise, day, sets };

                // Salva l'esercizio nel localStorage
                let savedExercises = JSON.parse(localStorage.getItem('profileExercises')) || [];
                savedExercises.push(newExercise);
                localStorage.setItem('profileExercises', JSON.stringify(savedExercises));

                // Aggiungi l'esercizio al database
                fetch('http://localhost:3000/addExercise', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newExercise)
                })
                .then(response => response.json())
                .then(data => {
                    console.log(data.message);
                    loadSavedExercises();
                })
                .catch(error => {
                    console.error('Errore durante l\'aggiunta dell\'esercizio:', error);
                });

                // Reset del form
                document.getElementById('addExerciseForm').reset();
            });
        </script>
    </div>
</body>
</html>
