<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheda Personalizzata - Gym</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        /* Menù laterale */
        .side-menu {
            width: 250px;
            background-color: #1e3a8a;
            color: white;
            position: fixed;
            height: 100%;
            padding-top: 20px;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.2);
            left: 0;
            top: 0;
        }

        .side-menu a {
            display: block;
            padding: 15px;
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            margin: 10px 0;
            transition: background-color 0.3s;
        }

        .side-menu a:hover {
            background-color: #2563eb;
        }

        header {
            background: linear-gradient(to right, #1e3a8a, #2563eb);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            margin-left: 230px;
            width: 100%;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 800px;
            margin-top: 20px;
        }

        .profile-card h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #1e3a8a;
            color: white;
        }

        .clear-button {
            background-color: #d9534f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .clear-button:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>
    <div class="side-menu">
        <a href="homepage.html">Homepage</a>
        <a href="scheda.html">La mia Scheda</a>
        <a href="esercizi.html">Esercizi Disponibili</a>
        <a href="profilo.html">Il mio Profilo</a>
        <a href="login.html" id="logout">Logout</a>
    </div>

    <div class="content">
        <header>
            <h1>La tua Scheda Personalizzata</h1>
        </header>

        <div class="profile-card">
            <h2>Esercizi Aggiunti</h2>
            <table>
                <thead>
                    <tr>
                        <th>Esercizio</th>
                        <th>Giorno</th>
                        <th>Serie</th>
                    </tr>
                </thead>
                <tbody id="savedExercisesTable"></tbody>
            </table>

            <button class="clear-button" id="clearExercises">Svuota Scheda</button>
        </div>

        <footer>
            <p>© 2025 Gym App | <a href="#">Privacy Policy</a> | <a href="#">Contattaci</a></p>
        </footer>

        <script>
            // Funzione per caricare gli esercizi dalla scheda personalizzata
            function displaySavedExercises() {
                const savedExercises = JSON.parse(localStorage.getItem('profileExercises')) || [];
                const exerciseList = document.getElementById('savedExercisesTable');

                if (savedExercises.length === 0) {
                    exerciseList.innerHTML = '<tr><td colspan="3">Non hai ancora aggiunto esercizi.</td></tr>';
                } else {
                    exerciseList.innerHTML = savedExercises.map(exercise => {
                        return `
                            <tr>
                                <td>${exercise.exercise}</td>
                                <td>${exercise.day}</td>
                                <td>${exercise.sets} serie</td>
                            </tr>
                        `;
                    }).join('');
                }
            }

            // Carica gli esercizi salvati quando la pagina è pronta
            window.onload = function() {
                displaySavedExercises();
            };

            // Gestisci il bottone "Svuota Scheda"
            document.getElementById('clearExercises').addEventListener('click', function() {
                localStorage.removeItem('profileExercises');
                displaySavedExercises();
                alert('Scheda svuotata con successo!');
            });
        </script>
    </div>
</body>
</html>
